name: export godot 3.5.3 game

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'

  pull_request:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'


jobs:
  build-pck:
    runs-on: ubuntu-latest

    steps:
      # 1. Get your project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install basic tools
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip

      # 3. Download Godot 3.5.3 headless
      - name: Download Godot (stable mirror)
        run: |
          wget -O godot.zip https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip godot.zip
          chmod +x Godot_v3.5.3-stable_linux_headless.64

      # 4. Download export templates
      - name: Download Export Templates
        run: |
          curl -L -o templates.tpz \
          https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/3.5.3.stable/
          unzip templates.tpz -d temp_templates

          cp -r temp_templates/templates/* ~/.local/share/godot/export_templates/3.5.3.stable/

      # 5. Export PCK
      - name: Build PCK
        run: |
          mkdir -p build
          ./Godot_v3.5.3-stable_linux_headless.64 \
            --path . \
            --export-pack "Linux/X11" build/game.pck

      # 6. Upload result
      - name: Upload PCK artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-pck
          path: build/game.pck

      # 6-5. downlad build artifact
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-pck.zip
          path: ./build

      # 7. setup butler
      - name: Setup Butler CLI
        uses: jdno/setup-butler@v1

      # 8. PUSH TO ITCH!!
      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push ./build-folder oxicjar/speencube:other

