name: export godot 3.5.3 game

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'

  pull_request:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip

      - name: Download Godot (3.5.3 headless)
        run: |
          wget -O godot.zip https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip godot.zip
          chmod +x Godot_v3.5.3-stable_linux_headless.64

      - name: Download Export Templates
        run: |
          wget -O templates.tpz https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/3.5.3.stable/
          unzip templates.tpz -d temp_templates

          cp -r temp_templates/templates/* ~/.local/share/godot/export_templates/3.5.3.stable/

      # =========================
      # HTML5 BUILD (ADDED FIX)
      # =========================
      - name: Export HTML5
        run: |
          mkdir -p build/web
          ./Godot_v3.5.3-stable_linux_headless.64 \
            --path . \
            --export "HTML5" build/web/index.html

      # =========================
      # PCK BUILD (YOUR ORIGINAL FIXED)
      # =========================
      - name: Build PCK
        run: |
          mkdir -p build/pc
          ./Godot_v3.5.3-stable_linux_headless.64 \
            --path . \
            --export-pack "Linux/X11" build/pc/game.pck

      # =========================
      # Upload PCK artifact
      # =========================
      - name: Upload PCK artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-pck
          path: build/pc/game.pck

      # =========================
      # Butler setup
      # =========================
      - name: Setup Butler CLI
        uses: jdno/setup-butler@v1

      # =========================
      # Push HTML5 to itch (FIXED PATH)
      # =========================
      - name: Push HTML5 to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push build/web oxicjar/speencube:html5

      # =========================
      # Push PCK to itch (FIXED PATH)
      # =========================
      - name: Push PCK to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push build/pc oxicjar/speencube:other
